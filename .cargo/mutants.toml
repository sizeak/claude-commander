# cargo-mutants configuration for claude-commander.
#
# Scope: pure-logic modules, across both `claude-commander-core` and the
# `claude-commander-tui` frontend crate. Files in `examine_globs` are
# side-effect-free enough that mutating them only exercises in-process
# behaviour; any IO functions co-located in these files are excluded by name in
# `exclude_re` below. Files that primarily perform real tmux/git/filesystem work
# (executor.rs, worktree.rs, manager/lifecycle.rs, config.rs, store.rs,
# main.rs, app/, picker.rs) are out of scope: mutation results there are
# only meaningful with mocked or containerised side-effect tests, which we
# don't have yet.
#
# NB: these are literal paths, and cargo-mutants does not error on a glob that
# matches nothing — so a stale entry silently shrinks coverage rather than
# failing. `widgets/tree_list/pr_colors.rs` had already gone stale before the
# frontend was extracted (#260 moved it up to `widgets/pr_colors.rs`), and
# `widgets/preview.rs` was deleted by #260 then restored by #267 along with the
# right-hand pane — it is listed again here. `widgets/status_glyph.rs` and
# `widgets/board/` are pure-logic candidates deliberately NOT added yet:
# widening mutation scope is its own call.

examine_globs = [
    # Pure parsing, state machines, and pattern matching
    "crates/claude-commander-core/src/tmux/state.rs",
    "crates/claude-commander-core/src/session/types.rs",
    "crates/claude-commander-core/src/config/keybindings.rs",
    "crates/claude-commander-core/src/fuzzy.rs",
    "crates/claude-commander-core/src/error.rs",
    "crates/claude-commander-core/src/git/diff.rs",
    "crates/claude-commander-tui/src/digit_accumulator.rs",
    "crates/claude-commander-tui/src/event.rs",
    # Widget state and rendering helpers (no IO)
    "crates/claude-commander-tui/src/widgets/mod.rs",
    "crates/claude-commander-tui/src/widgets/info_view.rs",
    "crates/claude-commander-tui/src/widgets/pr_colors.rs",
    "crates/claude-commander-tui/src/widgets/preview.rs",
    "crates/claude-commander-tui/src/widgets/tree_list/mod.rs",
    "crates/claude-commander-tui/src/widgets/tree_list/state.rs",
    "crates/claude-commander-tui/src/widgets/tree_list/render.rs",
]

# Belt-and-braces: even if examine_globs is widened later, these stay
# off-limits because mutating them could cause real filesystem, tmux, or git
# side effects on the host. The outer container also sandboxes these, but
# excluding here keeps mutation output focused on testable, deterministic code.
exclude_re = [
    # Real filesystem writes
    "Config::save",
    "ensure_directories",
    "atomic_write",
    # Real tmux/process side effects
    "TmuxExecutor::execute",
    "TmuxExecutor::kill_session",
    "TmuxExecutor::create_session",
    # Real git mutations
    "remove_worktree",
    "run_create_worktree",
    # Session lifecycle orchestration that ties the above together
    "SessionManager::kill_session",
    # Pure-logic files that contain one IO function each
    "compute_diff_for_path",  # in src/git/diff.rs — shells out to `git diff`
]

# Local runs can tolerate slowness; CI tuning can come later.
timeout_multiplier = 3.0

# Only run library unit tests during mutation testing.
#
# Integration tests under tests/ exercise the real tmux/git toolchain and rely
# on an interactive TTY for some flows (e.g. session restart), which isn't
# available inside the sandbox container. Pure-logic mutation targets are
# fully covered by unit tests, so excluding integration tests gives us a
# stable baseline without losing signal on the modules we care about.
additional_cargo_test_args = ["--lib"]
