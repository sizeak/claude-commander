name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

# Superseding a pull request cancels its in-flight run — pushing twice in quick
# succession used to run two full passes, and the first one's result is thrown
# away anyway.
#
# Push runs get a per-run group rather than a per-branch one, which keeps them
# out of the mechanism entirely. `cancel-in-progress: false` does not mean "never
# cancelled": GitHub holds at most one *pending* run per group, so a third merge
# arriving while the first is still building would cancel the second one's
# queued run — losing the fat-LTO build for that commit, which is the one thing
# the `nix` job's main-only build exists to guarantee.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Environment-level backstop against usage telemetry leaking to the live
# OpenObserve endpoint from CI. The baked ingest credential is compiled into
# every build, and `cfg!(test)` only suppresses the *core* crate's own unit
# tests — downstream crates' `cargo test`/`cargo run` link core as a normal
# dependency and would otherwise report. `DO_NOT_TRACK` (honoured by
# `telemetry::would_be_enabled`) neutralises every job regardless of per-fixture
# config, and is inherited into each `nix develop -c` step. (`nix build` runs in
# a network-less sandbox, so it needs no backstop.)
env:
  DO_NOT_TRACK: "1"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      # cache purging
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Run clippy through the Nix dev shell so system dependencies (ALSA via
      # rodio, pkg-config, …) come from flake.nix — the single source of truth —
      # rather than a hand-maintained apt list that drifts from the flake.
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      # Shared with the Build & Test and Packaging jobs: all three enter the same
      # default dev shell, so they were storing one identical 1.26 GB closure
      # three times over — against a hard 10 GB per-repo cache limit, which the
      # repo was exceeding, so entries were being evicted and jobs randomly took
      # the cold path. Keyed on flake.nix + flake.lock, which is what the closure
      # is built from — crane's devShell takes the checks' inputsFrom, not their
      # cargoArtifacts, so Cargo.lock does not belong in this key and including
      # it only threw the shell away on every dependency bump. This job owns the
      # save — it is the fastest of the three, and one writer means they don't
      # race for the same key.
      - name: Restore Nix Store Cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-devshell-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-devshell-${{ runner.os }}-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-devshell-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never

      # Shared with Build & Test and Packaging for the same reason: three copies
      # of the same registry + workspace debug target dir, ~1.6 GB in total. All
      # three compile the same dependency graph in the same dev profile — only
      # the seven workspace crates' own artefacts differ — so Build & Test owns
      # the save: its linked test binaries are the costlier half to rebuild,
      # whereas clippy re-lints the workspace from cached dependencies cheaply.
      - name: Restore Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-workspace
          save-if: false

      - name: Run Clippy
        run: nix develop -c cargo clippy --workspace --all-targets -- -D warnings

  nix:
    name: Nix Build
    runs-on: ubuntu-latest
    permissions:
      # cache purging
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      # `[profile.release]`'s fat LTO + `codegen-units = 1` re-optimise the whole
      # dependency graph in one largely serial LLVM pass — ~11 of this job's 12
      # minutes, and the reason crane's cached dependency artefacts buy so little.
      # Pull requests therefore build `.#claude-commander-ci` (same derivation,
      # LTO off), which still exercises the source filter, the read-only-vendor
      # preBuild workaround, bindgen in the sandbox and wrapProgram. Pushes to
      # `main` build the real `.#default` too, so the profile AUR / Homebrew /
      # `nix build` users compile is verified on every merge.
      #
      # A cargo profile override re-fingerprints every dependency, so the two
      # variants have distinct dependency derivations. `main` therefore builds
      # BOTH: a cache saved by a pull request lives in that PR's scope, and a PR
      # can only restore from its own ref, its base branch, or the default
      # branch — so if only PRs ever built the CI variant, its dependencies
      # would never reach a scope other PRs can read and every PR's first run
      # would compile ~600 crates cold, which is worse than the 12 minutes this
      # is meant to fix. Both variants share one store cache, so one entry
      # carries both dependency sets. Nobody waits on the post-merge run.
      - name: Select Build Variant
        id: variant
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "attrs=.#claude-commander-ci" >> "$GITHUB_OUTPUT"
          else
            echo "attrs=.#claude-commander-ci .#default" >> "$GITHUB_OUTPUT"
          fi

      # flake.nix is in the key, not just flake.lock: it defines the derivations
      # and the dev shells, so editing buildInputs or the src filter changes the
      # closure while flake.lock stands still. cache-nix-action does not
      # overwrite on an exact primary-key hit, so without this the stale entry
      # would hit forever and the new closure would be rebuilt on every run until
      # some unrelated lockfile bump finally moved the key.
      - name: Restore Nix Store Cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-build-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-build-${{ runner.os }}-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-build-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never

      # The flake's `src` filter decides what a rebuild costs: every file it
      # admits is part of the derivation hash, so one that isn't a build input
      # forces a needless full rebuild. Cheap (evaluation only, no build).
      - name: Check Nix Source Filter
        run: ./scripts/check-nix-src-filter.sh

      - name: Build
        run: nix build ${{ steps.variant.outputs.attrs }}

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build and test through the Nix dev shell: tmux, git, ALSA and the Rust
      # toolchain all come from flake.nix. Tests run outside the Nix build
      # sandbox (unlike `nix build`), so the ones needing a real git repo work.
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      # Nix store cache: restore-only, the Clippy job owns the save.
      # Cargo cache: this job owns the save (see the Clippy job's comments).
      - name: Restore Nix Store Cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-devshell-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-devshell-${{ runner.os }}-
          save: false

      - name: Restore Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-workspace

      - name: Build
        run: nix develop -c cargo build --workspace --all-targets

      - name: Run Tests
        run: nix develop -c cargo test --workspace

  packaging:
    name: Packaging Install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      # Both restore-only — Clippy owns the Nix store cache, Build & Test the
      # Cargo one. `cargo install --path` builds in its own temporary target
      # directory, so what this job gets out of the Cargo cache is the populated
      # registry rather than reusable artefacts.
      - name: Restore Nix Store Cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-devshell-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-devshell-${{ runner.os }}-
          save: false

      - name: Restore Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-workspace
          save-if: false

      # Mirrors the Homebrew formula's install step, which is
      # `cargo install --locked --root <prefix> --path <crate>`. Every other job
      # builds via `cargo build --workspace` from the repo root, and a workspace
      # build is perfectly happy with a virtual manifest — so when the server
      # split (v0.24.0) removed `[package]` from the root `Cargo.toml`, nothing
      # in CI noticed that the formula's `--path .` had stopped resolving. Brew
      # installs stayed broken for eight releases. Installing the same way the
      # formula does is the only check that fails when the packaged crate path
      # drifts. `--debug` skips the LTO release profile purely for CI time; the
      # packaged path, not the release profile, is what this job guards (the Nix
      # Build job already covers an optimised build).
      - name: Install Like Homebrew Does
        run: nix develop -c cargo install --locked --debug --root "$RUNNER_TEMP/brew-prefix" --path crates/claude-commander

      # The formula's `test do` block asserts the version appears in the
      # `--version` output; do the same so the packaged binary is exercised.
      - name: Verify Installed Binary
        run: |
          version=$(nix develop -c cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "claude-commander") | .version')
          "$RUNNER_TEMP/brew-prefix/bin/claude-commander" --version | grep -F "$version"

  client:
    name: Client Tests
    runs-on: ubuntu-latest
    permissions:
      # cache purging
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The launcher-icon test reads the SVG masters under client/tool/icon,
          # and *.svg is LFS-tracked (.gitattributes) — without this the test
          # sees pointer files. The whole LFS store is ~300 KB of icon art.
          lfs: true

      # The Flutter + host-Rust + Linux-desktop toolchain comes from the slim
      # `clientCi` dev shell in flake.nix (no Android SDK/NDK). tmux + git are
      # present for the hermetic server the e2e boots.
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      # Keeps its own cache: the clientCi shell (Flutter, GTK, Mesa) shares
      # little with the default shell. Bounded and purged like the others — it
      # was the largest entry in the repo at 3.83 GB and had neither. Keyed on
      # this job's own inputs: `**/Cargo.lock` used to match client/rust's
      # lockfile *and* the core one, so a core dependency bump discarded the
      # Flutter toolchain along with it.
      - name: Restore Nix Store Cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-client-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'client/rust/Cargo.lock', 'client/pubspec.lock') }}
          restore-prefixes-first-match: nix-client-${{ runner.os }}-
          gc-max-store-size-linux: 6G
          purge: true
          purge-prefixes: nix-client-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never

      - name: Restore Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/rust

      # The Flutter SDK comes from the Nix store (cached above); this caches the
      # downloaded pub packages so `flutter pub get` doesn't re-fetch every run.
      - name: Restore Pub Cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('client/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Fetch Flutter Packages
        # The pub cache is restored via a restore-keys prefix, so it can carry a
        # stale/partial checkout of a git dependency (the xterm fork) from an
        # older run whose pin differed. pub then mis-resolves the git dep and
        # fails generating package_graph.json ("dependencies for `zmodem`
        # missing"). Drop just the git portion so git deps are re-cloned fresh;
        # the large hosted-package cache is still reused.
        run: nix develop .#clientCi -c bash -c 'rm -rf ~/.pub-cache/git && cd client && flutter pub get'

      - name: Format Dart
        run: nix develop .#clientCi -c client/tool/dart-format.sh --check

      - name: Analyze Dart
        run: nix develop .#clientCi -c bash -c 'cd client && flutter analyze lib test integration_test'

      - name: Run Dart Unit Tests
        run: nix develop .#clientCi -c bash -c 'cd client && flutter test'

      # A failing golden is otherwise undiagnosable from here: the log gives a
      # percentage and a pixel count, never what moved, and the images the
      # comparator writes die with the runner. `flutter test` drops isolated /
      # masterImage / testImage PNGs into test/goldens/failures for exactly this.
      # Failure-only, so a green run pays nothing; ignored when the run failed
      # for some other reason and the directory does not exist.
      - name: Upload Golden Failure Images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: client/test/goldens/failures/
          if-no-files-found: ignore
          retention-days: 7

      - name: Run cdylib Integration Tests
        run: nix develop .#clientCi -c bash -c 'cd client/rust && cargo test'

      # DISABLED for this PR: the headless Linux GUI e2e (flutter test
      # integration_test under xvfb) builds fine but the app fails to *launch*
      # in CI — it needs a full headless GUI runtime (D-Bus session + a secret
      # service for flutter_secure_storage_linux, software GL). Standing that up
      # is its own task; tracked as a follow-up. The client is still covered by
      # the Dart unit tests and the cdylib integration tests above.
      #
      # When re-enabling, cargokit resolves `rustup` from ~/.cargo/bin *before*
      # PATH, so the shim must be linked there first (else `rustc -vV` 127):
      #   - name: Run Linux End-to-End Tests
      #     run: nix develop .#clientCi -c bash -c 'mkdir -p ~/.cargo/bin && ln -sf "$(command -v rustup)" ~/.cargo/bin/rustup && xvfb-run -a client/tool/e2e.sh'
