name: claude_commander_client
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.3

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  rust_lib_claude_commander_client:
    path: rust_builder
  flutter_rust_bridge: 2.11.1
  flutter_secure_storage: ^10.3.1
  # Non-secret device preferences (the selected theme). Deliberately not
  # flutter_secure_storage: routing a UI preference through the Android Keystore
  # / libsecret would gate the first frame's theme on the keyring being unlocked.
  shared_preferences: ^2.3.2
  uuid: ^4.5.3
  # Terminal emulator widget for the live PTY view. Pinned to our fork's
  # `commander` branch, which carries local patches on top of upstream v4.0.0
  # (see pubspec.lock resolved-ref for the exact commit).
  xterm:
    git:
      url: https://github.com/sizeak/xterm.dart.git
      ref: commander
  # Image attach for the terminal view. `image_picker` is fully supported on
  # Android (native photo picker + camera) and "limited" on Linux, where its
  # endorsed `image_picker_linux` implementation delegates to `file_selector` —
  # a GTK file dialog, no camera. That asymmetry is why the UI only offers a
  # camera option on Android.
  image_picker: ^1.2.3
  # Clipboard image *reading*, which Flutter's own `Clipboard` cannot do (text
  # only). Covers Linux and Android from one API, so a phone screenshot pastes
  # just like a desktop one. Builds its own Rust via cargokit — already a
  # requirement here for flutter_rust_bridge, so no new toolchain.
  super_clipboard: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  # Generates the platform launcher icons (all Android densities + adaptive
  # icons) from the source art under tool/icon/. Regenerate with:
  #   dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4

# App launcher icon generation. Source art lives in tool/icon/ (SVG masters
# alongside the rendered PNGs). The adaptive background carries the dark navy
# gradient; the green/yellow rank chevrons sit on the transparent foreground
# layer.
#
# Each platform gets its own master rather than sharing icon_full.png, because
# the three consume art differently and the mismatch is visible: iOS masks to
# its own superellipse (so the art must be full-bleed and opaque), while macOS
# masks nothing (so the art must carry Apple's 824/1024 inset itself). See the
# header comments in icon_ios.svg / icon_macos.svg.
flutter_launcher_icons:
  android: true
  image_path: "tool/icon/icon_full.png"
  min_sdk_android: 21
  adaptive_icon_background: "tool/icon/icon_background.png"
  adaptive_icon_foreground: "tool/icon/icon_foreground.png"
  ios: true
  image_path_ios: "tool/icon/icon_ios.png"
  # icon_ios.svg is drawn without transparency, so this is a backstop, not the
  # mechanism: an App Store submission is rejected outright for an alpha channel
  # in the app icon, and that failure surfaces at upload time rather than build
  # time. Cheap insurance against a future edit reintroducing one.
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "tool/icon/icon_macos.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Bundled OFL fonts (see assets/fonts/*-OFL.txt for licences). Both are
  # variable fonts declared once; Flutter maps TextStyle.fontWeight onto the
  # wght axis, so all weights (400–700) resolve from the single file.
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-VF.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-VF.ttf
    # The LCARS theme's display face — condensed, uppercase-led. Only ever used
    # for chrome: terminal output stays JetBrainsMono in every theme.
    - family: Antonio
      fonts:
        - asset: assets/fonts/Antonio-VF.ttf

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
