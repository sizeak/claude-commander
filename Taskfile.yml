# Local mirrors of the CI workflow's checks (.github/workflows/ci.yml).
#
# The contract of `task test-ci` is that it runs the *same commands* CI runs,
# inside the *same Nix dev shells* CI enters — so the toolchain doing the work
# (Rust, Flutter and its pinned Skia, tmux, git) is the pinned one rather than
# whatever happens to be on your PATH. Update these tasks and ci.yml together.
#
# It covers all six jobs in ci.yml: fmt, clippy, nix, test, packaging, client.
# Two documented departures, each explained at the task that makes it: fmt-check
# uses the flake's rustfmt where CI's Format job uses dtolnay stable, and pub-get
# skips a CI-cache workaround. The client e2e is absent because CI cannot run it
# either (the step is disabled in ci.yml).
#
# What this does and does not pin, for the golden tests specifically, because
# "passes locally, fails on the runner" is the failure these tasks exist for:
#
#   Pinned, and therefore reproduced here:
#     - The Flutter SDK and its Skia, from the `clientCi` shell in flake.nix.
#     - The three bundled faces (Space Grotesk, JetBrains Mono, Antonio), which
#       are repo assets loaded into the test binding by test/support/golden.dart,
#       plus MaterialIcons resolved from the Nix-pinned FLUTTER_ROOT. No golden
#       reads a system font, so there is nothing font-related to configure: the
#       host's fontconfig is not consulted.
#     - devicePixelRatio 1, fixed by the harness (useGoldenSurface), so a golden
#       is not sensitive to your display scaling.
#
#   NOT pinned, and not reproducible by any local configuration:
#     - The runner's text antialiasing. One golden (the LCARS phone shell) failed
#       only on CI for exactly this reason — 1179 px confined to a 13-row band,
#       geometry byte-identical, i.e. label antialiasing alone. It was deleted in
#       #280 rather than tuned, and its layout is asserted geometrically in
#       client/test/phone_shell_test.dart instead. So a green `task test-ci` is
#       strong evidence but not a proof; read CI's golden-failures artifact if a
#       golden fails there and passes here.
#
# TERM is pinned; COLORTERM deliberately is not. They are not the same case:
#
#   - COLORTERM is read only by ColorMode::detect() (tui/theme.rs:39). Tests do
#     reach that function — `Theme::default()` is `for_color_mode(detect())`
#     (theme.rs:168) and four board-widget tests construct one
#     (tui/widgets/board/render.rs:1661, 1880, 1930, 1973) — but no test
#     *assertion* depends on what it returns: those four assert cell symbols and
#     the returned button/heading/hit regions, never styles, so the detected
#     palette is built and discarded. Pinning COLORTERM would imply the suite
#     depends on it, which no assertion does.
#   - TERM additionally reaches HeadlessAttach::spawn (tmux/headless_attach.rs:67),
#     which the server's /ws/attach integration tests exercise. There
#     `fallback_term` normalises an unset/empty/"dumb"/"unknown" TERM to
#     xterm-256color but passes a real one straight through to `tmux attach`, so
#     a developer in kitty or tmux hands those tests a different TERM than a
#     headless host does, and tmux emits different sequences into the PTY they
#     read. Pinning it to the value the fallback would itself choose makes that
#     path behave the same either way, without this file having to assert
#     anything about a runner's environment.

version: '3'

includes:
  local:
    taskfile: ./Taskfiles/Taskfile-local.yml # For any user specific tasks you want to add, not checked in to the repo
    flatten: true
    optional: true

silent: true
# No `output: group` on purpose: it withholds a task's output until the task
# finishes, and several of these run for minutes (a cold `nix build`, the Rust
# test suite), where silence is indistinguishable from a hang.

vars:
  # Environment pinned for every task that *executes* our Rust code, as an inline
  # prefix rather than a top-level `env:` block.
  #
  # This is not a style choice. go-task's `env:` only fills a variable that is
  # absent from the caller's environment; it does not override one already set.
  # Verified on task 3.52.0: with TERM=kitty-direct exported, a task whose
  # Taskfile set `env: TERM: xterm-256color` still saw kitty-direct, while an
  # inline `TERM=… cmd` prefix in the same task saw xterm-256color. Since TERM is
  # always set in an interactive shell, an env block could never have pinned it —
  # and the prefix does survive `nix develop -c` into the command (checked the
  # same way). A new task that runs our Rust code should carry this prefix — the
  # line is Rust, not ours-vs-theirs: the Dart suites below run our code too, and
  # correctly do not carry it, because nothing in them links core.
  #
  # Which tasks need it, checked rather than assumed: `test`, `cdylib-test` (its
  # dev-dependencies include core — see client/rust/Cargo.toml — so host tests do
  # execute core code) and both commands in `packaging`. The rest cannot read
  # either variable: `build`/`clippy`/`fmt-check` compile or lint without running,
  # `nix-build` is sandboxed and network-less, and the Dart tasks never load the
  # cdylib (no RustLib.init/DynamicLibrary anywhere under client/test — the suite
  # drives a FakeCommanderApi) so no Rust code runs there at all.
  #
  #   DO_NOT_TRACK — ci.yml sets this at workflow level so no CI job reports usage
  #     telemetry to the live endpoint. Local runs need it for the same reason: the
  #     ingest credential is baked into every build, and cfg!(test) only suppresses
  #     core's *own* unit tests, while downstream crates link core as a normal
  #     dependency. An `env:` block would have left a developer who has
  #     DO_NOT_TRACK=0 exported reporting to the live endpoint, since "0" reads as
  #     opted *in* (telemetry/mod.rs:238).
  #   TERM — see the header note; this is the value `fallback_term` itself picks
  #     for a headless host.
  PINNED_ENV: DO_NOT_TRACK=1 TERM=xterm-256color

  # The two dev shells CI uses: the default one for the Rust workspace, the slim
  # host-only `clientCi` one (no Android SDK/NDK) for the Flutter client. Both
  # flake refs are anchored to ROOT_DIR rather than `.` so a task can set `dir:`
  # to a subdirectory without the ref following it somewhere there is no flake.
  NIX: nix develop {{.ROOT_DIR}} -c
  NIX_CLIENT: nix develop {{.ROOT_DIR}}#clientCi -c

tasks:
  default:
    cmds:
      - task --list

  test-ci:
    desc: Run all six CI jobs the way CI runs them (nix-build and packaging are the slow ones)
    aliases:
      - ci
    # Sequential `cmds`, not `deps` — deps run in parallel, and these share the
    # cargo/pub build directories. CI runs its six jobs concurrently, so the
    # order here is ours to choose: cheapest first, so a formatting slip fails in
    # seconds rather than after a cold `nix build`.
    #
    # Does not forward `--` arguments: the leaf tasks that accept CLI_ARGS take
    # different filter syntaxes (cargo's vs `flutter test`'s), so one filter
    # cannot be meaningful to all of them. Pass args to a leaf task directly.
    cmds:
      - task: fmt-check
      - task: clippy
      - task: build
      - task: test
      - task: client-ci
      - task: packaging
      - task: nix-build
      - echo "All CI checks passed."

  # ── Rust workspace: mirrors the Format, Clippy and Build & Test jobs ────────
  fmt-check:
    desc: "Check Rust formatting (CI: Format)"
    # The one check where local and CI can legitimately disagree: CI's Format job
    # takes rustfmt from dtolnay/rust-toolchain@stable (ci.yml:28-34) rather than
    # a Nix shell, so it tracks whatever the current stable release is while this
    # uses the flake-pinned rustfmt. Pinned is the right default for a local
    # gate — an unpinned host rustfmt (or none at all) is the failure this whole
    # file exists to remove — but a rustfmt release that changes formatting will
    # show up as CI-only red until flake.lock catches up.
    cmds:
      - '{{.NIX}} cargo fmt --all -- --check'

  clippy:
    desc: "Lint the workspace, warnings as errors (CI: Clippy)"
    cmds:
      - '{{.NIX}} cargo clippy --workspace --all-targets -- -D warnings'

  build:
    desc: "Build the workspace including test targets (CI: Build & Test)"
    cmds:
      - '{{.NIX}} cargo build --workspace --all-targets'

  test:
    desc: "Run the Rust test suite (CI: Build & Test); pass a filter after --"
    cmds:
      - '{{.PINNED_ENV}} {{.NIX}} cargo test --workspace {{.CLI_ARGS}}'

  nix-build:
    desc: "Build the flake package in the Nix sandbox (CI: Nix Build)"
    # Not the same build as `task build`: this one runs in the network-less Nix
    # sandbox against the packaged derivation, which has caught breakage the dev
    # shell could not (the libspa-sys bindgen write into crane's read-only vendor
    # dir). Note it builds the *git* tree — a source file you have not staged is
    # invisible here, so this can fail on a missing file while `cargo build`,
    # which reads your working directory, passes.
    cmds:
      - nix build

  packaging:
    desc: "Install the way the Homebrew formula does (CI: Packaging Install)"
    # Guards the packaged crate path, not the build: every other check builds via
    # `--workspace`, which is happy with a virtual manifest, so when the server
    # split removed `[package]` from the root Cargo.toml nothing noticed that the
    # formula's `--path .` had stopped resolving and brew installs stayed broken
    # for eight releases (ci.yml:152-162). `--debug` skips the LTO release
    # profile, as CI does; nix-build already covers an optimised build.
    cmds:
      - |
        prefix="$(mktemp -d)"
        trap 'rm -rf "$prefix"' EXIT
        {{.PINNED_ENV}} {{.NIX}} cargo install --locked --debug --root "$prefix" --path crates/claude-commander
        # The formula's `test do` block asserts the version appears in
        # `--version`. CI reads it with `cargo metadata | jq`; do it from
        # [workspace.package] instead, because the dev shell does not provide jq
        # (the one on PATH inside it is the host's) and this is the same source
        # of truth the crate inherits via `version.workspace = true`.
        version="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
        test -n "$version" || { echo "could not read version from Cargo.toml" >&2; exit 1; }
        {{.PINNED_ENV}} "$prefix/bin/claude-commander" --version | grep -F "$version"

  # ── Flutter client: mirrors the Client Tests job ────────────────────────────
  client-ci:
    desc: "Run every client check (CI: Client Tests)"
    cmds:
      - task: pub-get
      - task: dart-format-check
      - task: dart-analyze
      - task: dart-test
      - task: cdylib-test

  pub-get:
    desc: Resolve the client's pub dependencies
    dir: client
    # CI additionally clears ~/.pub-cache/git first, because its cache is
    # restored by a restore-keys prefix and can carry a stale checkout of the
    # xterm fork. That is a cache-restore workaround, not part of the
    # environment: replicating it locally would re-clone the fork every run.
    cmds:
      - '{{.NIX_CLIENT}} flutter pub get'

  dart-format-check:
    desc: "Check Dart formatting (CI: Format Dart)"
    # No `dir:` — the script takes repo-root-relative arguments and cds itself.
    cmds:
      - '{{.NIX_CLIENT}} client/tool/dart-format.sh --check'

  dart-analyze:
    desc: "Analyze the Dart sources (CI: Analyze Dart)"
    dir: client
    cmds:
      - '{{.NIX_CLIENT}} flutter analyze lib test integration_test'

  dart-test:
    desc: "Run all Dart tests, goldens included (CI: Run Dart Unit Tests)"
    dir: client
    cmds:
      - '{{.NIX_CLIENT}} flutter test {{.CLI_ARGS}}'

  cdylib-test:
    desc: "Test the client's Rust cdylib (CI: Run cdylib Integration Tests)"
    dir: client/rust
    cmds:
      - '{{.PINNED_ENV}} {{.NIX_CLIENT}} cargo test {{.CLI_ARGS}}'

  # ── Goldens ────────────────────────────────────────────────────────────────
  # `dart-test` already covers these; these two are the focused loop for a change
  # that touches the chrome layer. The client e2e is not here: CI cannot run it
  # (see the disabled step in ci.yml) and it is driven by client/tool/e2e.sh.
  goldens:
    desc: Run only the golden tests, in CI's configuration
    dir: client
    cmds:
      - '{{.NIX_CLIENT}} flutter test test/goldens {{.CLI_ARGS}}'

  goldens:update:
    desc: Regenerate the reference images, then read the diff before committing
    dir: client
    cmds:
      - '{{.NIX_CLIENT}} flutter test test/goldens --update-goldens'
      - echo ""
      - echo "References regenerated. Review the image diff before committing —"
      - echo "an unexplained pixel change is the entire point of these tests."
