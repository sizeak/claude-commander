[package]
name = "claude-commander-chat-slack"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Slack backend for Claude Commander's chat bridge (Socket Mode + Web API)"
publish = false

# Only the `claude-commander` bin crate drives the release (single shared tag).
[package.metadata.release]
release = false

[dependencies]
claude-commander-chat = { path = "../claude-commander-chat" }
claude-commander-core = { path = "../claude-commander-core", default-features = false }
async-trait = "0.1"
regex = "1.12"
tokio = { workspace = true }
tracing = { workspace = true }
# `hyper-base`, not `hyper`: the latter's `rustls-native-certs` feature also
# turns on rustls's `ring` provider, and a second provider beside reqwest's
# `aws-lc-rs` leaves rustls unable to pick a process default — every implicit
# `ClientConfig::builder()` in the binary then panics. So the HTTPS connector
# is built here on aws-lc-rs, and Socket Mode's WebSocket TLS is enabled
# directly (provider-neutral; it uses the single process default).
slack-morphism = { version = "2.23", features = ["hyper-base"] }
hyper-rustls = { version = "0.27", default-features = false, features = [
  "aws-lc-rs",
  "native-tokio",
  "http1",
  "http2",
  "tls12",
] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
  "rustls-tls-native-roots",
] }
