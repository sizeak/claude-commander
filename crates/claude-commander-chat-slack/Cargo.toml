[package]
name = "claude-commander-chat-slack"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Slack backend for Claude Commander's chat bridge (Socket Mode + Web API)"
publish = false

# Only the `claude-commander` bin crate drives the release (single shared tag).
[package.metadata.release]
release = false

[dependencies]
claude-commander-chat = { path = "../claude-commander-chat" }
claude-commander-core = { path = "../claude-commander-core", default-features = false }
async-trait = "0.1"
regex = "1.12"
tokio = { workspace = true }
tracing = { workspace = true }
# The `hyper` feature pulls in the rustls-based HTTPS connector and the
# tokio-tungstenite WebSocket transport Socket Mode needs; no default features.
slack-morphism = { version = "2.23", features = ["hyper"] }
# Only to pick the process-wide crypto provider (see `install_crypto_provider`).
rustls = { version = "0.23", default-features = false, features = ["ring"] }
