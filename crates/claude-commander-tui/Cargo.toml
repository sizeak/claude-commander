[package]
name = "claude-commander-tui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Ratatui terminal frontend for claude-commander"
keywords = ["claude", "ai", "terminal", "tui", "tmux"]
categories = ["command-line-utilities", "development-tools"]

# Only the `claude-commander` bin crate drives the release (single shared tag).
# Without this, cargo-release would try to create the same `vX.Y.Z` tag once per
# member and the second attempt fails.
[package.metadata.release]
release = false

[lib]
name = "claude_commander_tui"
path = "src/lib.rs"

[dependencies]
# The library this frontend renders. Default features stay ON here (unlike the
# server/remote/client, which take core with `default-features = false`): this
# IS the desktop frontend, so it is the consumer that genuinely wants core's
# `audio` (mic/speaker for conversation mode) and `clipboard` (Ctrl+V paste).
claude-commander-core = { path = "../claude-commander-core" }

# Terminal rendering. Core depends on `ratatui-core` only, for the `Color` in
# `[theme]` config values — full ratatui (widgets, layout, backends) lives here.
ratatui = "0.30"
# `event-stream` is needed for the async `EventStream` the event loop selects on.
# Core keeps plain crossterm (persisted `KeyCode`/`KeyModifiers` in the keybinding
# map) but not this feature.
crossterm = { version = "0.29", features = ["event-stream"] }
# Text-input buffer (cursor/editing) for the review comment box and modals.
tui-input = "0.15"

# Syntax highlighting for the review diff view (fancy-regex backend — pure
# Rust, no C/oniguruma dependency). `two-face` supplies an extended syntax set
# (the bat language set, incl. TypeScript/TSX/TOML/…) that syntect's bundled
# defaults lack.
syntect = { version = "5.3", default-features = false, features = [
    "default-fancy",
] }
two-face = { version = "0.5", default-features = false, features = [
    "syntect-fancy",
] }

# Throbber/spinner widget
throbber-widgets-tui = "0.11"

# Parallel syntax highlighting of the review diff's lines.
rayon = "1.12.0"

# Inline image rendering (pasted screenshots in the review view). Default
# features include `chafa-dyn`, which needs the chafa C lib via pkg-config; we
# only need the built-in protocols + crossterm integration.
ratatui-image = { version = "11.0.6", default-features = false, features = [
    "crossterm",
    "image-defaults",
] }
image = "0.25"

# Async runtime (background fetches, the event loop) + stream combinators.
tokio = { workspace = true }
futures = "0.3"

# Serialization: `tui.json` prefs (serde/serde_json) and the settings modal's
# round-trip of a `[theme]` colour value through TOML (toml).
serde = { workspace = true }
serde_json = { workspace = true }
toml = "1.1"

# Timestamps rendered in the session list and the Alt+Tab picker.
chrono = { version = "0.4", features = ["serde"] }
# Comment ids in the review view.
uuid = { version = "1.23", features = ["v4", "serde"] }

# `~` expansion in the path-completion widget.
directories = "6.0"
# `flock` for the `tui.json` write lock.
nix = { version = "0.31", features = ["fs"] }

# This crate's own error enum (`TuiError`). Core's error hierarchy no longer has
# a TUI variant, so terminal failures are typed here.
thiserror = { workspace = true }

# Observability
tracing = { workspace = true }

[dev-dependencies]
# Re-state core with `test-support` to reach its test scaffolding
# (`backend::mock::MockBackend`, `api::workspace_snapshot_from_state`), which is
# `#[cfg(test)]`-gated in core and therefore invisible across the crate boundary.
# Being a dev-dependency, the feature is active for `cargo test` only — a plain
# `cargo build` of this crate still gets core without it.
claude-commander-core = { path = "../claude-commander-core", features = [
    "test-support",
] }
# Temp directories for the prefs / path-completer tests.
tempfile = "3.27"
